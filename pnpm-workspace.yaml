nodeLinker: hoisted

publicHoistPattern:
  - '*prisma*'

# typography's peer expression includes the non-semver token `insiders`;
# allow the installed stable Tailwind release until upstream corrects it.
peerDependencyRules:
  allowedVersions:
    tailwindcss: '4.3.3'
    vite: '*'
    vitest: '*'
  allowAny:
    - vite
    - vitest

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  esbuild: true
  lefthook: true
  prisma: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - '@voidzero-dev/*'
  - '@oxc-project/*'
  - oxlint
  - '@oxlint/*'
  - oxfmt
  - '@oxfmt/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - vitest
  - '@vitest/*'
  - tinybench
  - yuku-core
  - yuku-parser
  - '@yuku-core/*'
  - '@yuku-toolchain/*'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.943ee4a9e322a7ad4b1b4113f844cd541a10b159
  vitest: 5.1.0
  vite-plus: 0.0.0-commit.943ee4a9e322a7ad4b1b4113f844cd541a10b159
  '@vitest/coverage-v8': 5.1.0
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
