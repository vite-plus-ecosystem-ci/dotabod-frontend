nodeLinker: hoisted

publicHoistPattern:
  - '*prisma*'

# typography's peer expression includes the non-semver token `insiders`;
# allow the installed stable Tailwind release until upstream corrects it.
peerDependencyRules:
  allowedVersions:
    tailwindcss: '4.3.3'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  esbuild: true
  lefthook: true
  prisma: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - '@voidzero-dev/*'
  - '@oxc-project/*'
  - oxlint
  - '@oxlint/*'
  - oxfmt
  - '@oxfmt/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - vitest
  - '@vitest/*'
  - tinybench
  - yuku-core
  - yuku-parser
  - '@yuku-core/*'
  - '@yuku-toolchain/*'
