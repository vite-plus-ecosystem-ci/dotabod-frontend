nodeLinker: hoisted

publicHoistPattern:
  - '*prisma*'

# typography's peer expression includes the non-semver token `insiders`;
# allow the installed stable Tailwind release until upstream corrects it.
peerDependencyRules:
  allowedVersions:
    tailwindcss: '4.3.3'
    vite: '*'
    vitest: '*'
  allowAny:
    - vite
    - vitest

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  esbuild: true
  lefthook: true
  prisma: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - '@voidzero-dev/*'
  - '@oxc-project/*'
  - oxlint
  - '@oxlint/*'
  - oxfmt
  - '@oxfmt/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - vitest
  - '@vitest/*'
  - tinybench
  - yuku-core
  - yuku-parser
  - '@yuku-core/*'
  - '@yuku-toolchain/*'
  - '@tsrs/darwin-arm64@7.1.0-beta.tsrs2'
  - '@tsrs/darwin-x64@7.1.0-beta.tsrs2'
  - '@tsrs/linux-arm64-gnu@7.1.0-beta.tsrs2'
  - '@tsrs/linux-arm64-musl@7.1.0-beta.tsrs2'
  - '@tsrs/linux-x64-gnu@7.1.0-beta.tsrs2'
  - '@tsrs/linux-x64-musl@7.1.0-beta.tsrs2'
  - '@tsrs/win32-arm64@7.1.0-beta.tsrs2'
  - '@tsrs/win32-x64@7.1.0-beta.tsrs2'
  - tsrs@7.1.0-beta.tsrs2
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.309b96aaf065d95452ca218076c666671cf36440
  vitest: 5.1.0
  vite-plus: 0.0.0-commit.309b96aaf065d95452ca218076c666671cf36440
  '@vitest/coverage-v8': 5.1.0
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
