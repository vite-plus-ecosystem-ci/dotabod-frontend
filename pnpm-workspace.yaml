nodeLinker: hoisted

publicHoistPattern:
  - "*prisma*"

# typography's peer expression includes the non-semver token `insiders`;
# allow the installed stable Tailwind release until upstream corrects it.
peerDependencyRules:
  allowedVersions:
    tailwindcss: "4.3.3"
    vite: "*"
    vitest: "*"
  allowAny:
    - vite
    - vitest

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@sentry/cli": true
  esbuild: true
  lefthook: true
  prisma: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.dd71b05c0f66a3529d0da591363c1ee6be3ec17d
  vitest: 5.0.1
  vite-plus: 0.0.0-commit.dd71b05c0f66a3529d0da591363c1ee6be3ec17d
  "@vitest/coverage-v8": 5.0.1
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
