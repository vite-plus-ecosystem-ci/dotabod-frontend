nodeLinker: hoisted

publicHoistPattern:
  - "*prisma*"

# typography's peer expression includes the non-semver token `insiders`;
# allow the installed stable Tailwind release until upstream corrects it.
peerDependencyRules:
  allowedVersions:
    tailwindcss: "4.3.3"
    vite: "*"
    vitest: "*"
  allowAny:
    - vite
    - vitest

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@sentry/cli": true
  esbuild: true
  lefthook: true
  prisma: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.7cb75b46f7a73413ee0803eaac3f6a6b6763f158
  vitest: 5.0.3
  vite-plus: 0.0.0-commit.7cb75b46f7a73413ee0803eaac3f6a6b6763f158
  "@vitest/coverage-v8": 5.0.3
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@0.0.0-commit.7cb75b46f7a73413ee0803eaac3f6a6b6763f158"
  - "@voidzero-dev/vite-plus-darwin-arm64@0.0.0-commit.7cb75b46f7a73413ee0803eaac3f6a6b6763f158"
